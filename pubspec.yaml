name: lanflow
description: A local network messenger for Windows and Android.
publish_to: none
version: 0.1.1+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  archive: ^4.5.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  ffi: ^2.2.0
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  open_filex: ^4.7.0
  desktop_drop: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
